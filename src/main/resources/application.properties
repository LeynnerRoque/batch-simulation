# 1. Configurações do Banco de Dados (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/db_batch_simulacao
spring.datasource.username=root
spring.datasource.password=roque1989
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Configurações do Spring Batch
# Cria as tabelas internas do Batch (BATCH_JOB_INSTANCE, etc) automaticamente
spring.batch.jdbc.initialize-schema=always

spring.batch.job.enabled=true

# 3. Configurações de SQL e Logs
# Mostra o SQL no console (útil para debugar o JOIN que fizemos no Reader)
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.batch=INFO

# 4. Hibernate/JPA (Opcional, mas evita erros se o starter estiver no classpath)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true